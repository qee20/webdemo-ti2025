<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Legends Chars</title>
</head>
<body>
    <h1>Choose Your Favorite Legends</h1>
    <select id="charOption" onchange="gantiGambarKarakter()">
        <option value="none">...</option>
        <option value="wraith">Wraith</option>
        <option value="crypto">Crypto</option>
        <option value="seer">Seer</option>
        <option value="ash">Ash</option>
        <option value="revenant">Revenant</option>
        <option value="pathfinder">Pathfinder</option>
    </select>

    <br>
    <hr>
    <br>

    <img id="charImage" src="https://placehold.co/600x400" alt="char image" width="auto" height="500">
    <p id="namaKarakter">Silahkan pilih item</p>


    <script src="./script.js"></script>
</body>
</html>
