<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar Belanjaan Sederhana</title>
</head>
<body>
  <h1>Daftar Belanjaan</h1>
  <form id="itemForm">
    <label for="itemName">Nama Item: </label>
    <input type="text" id="itemName" required />
    <label for="itemPrice">Harga: </label>
    <input type="number" id="itemPrice" required min="0" step="0.01" />
    <label for="itemPrice">Uang Belanja: </label>
    <input type="number" id="budgetMoney" required min="10000" step="1000" />
    <button type="submit">Add Item</button>
  </form>

  <h2>Item yang ditambahkan</h2>
  <ul id="itemsList">
    <!-- Shopping items will appear here -->
  </ul>

  <h3>Total: <span id="totalPrice">Rp 0</span></h3>
  <h3>Kembalian: <span id="restMoney">Rp 0</span><span id="ngutang"></span></h3>

  <script src="./script.js"></script>
</body>
</html>
