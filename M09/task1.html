<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background: white;

        }

        .header {
            height: 50px;
            border: 1px solid black;
            background-color: skyblue;
            padding-left: 10px;
        }

        p {
            font-weight: bold;
            color: white;
        }

        .main {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .main2 {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .main-content {
            background: green;
            width: 250px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 5px;
        }

        .sidebar {
            background: blue;
            width: 150px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 5px;
        }

        .twin {
            background: orange;
            width: 200px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px;
        }

        .footer {
            height: 50px;
            border: 1px solid black;
            background-color: blue;
            padding-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <p>.header</p>
        </div>
        <div class="main">
            <div class="main-content">
                <p>.main-content</p>
            </div>
            <div class="sidebar">
                <p>.sidebar</p>
            </div>

        </div>
        <div class="main2">
            <div class="twin">
                <p>.twin</p>
            </div>
            <div class="twin">
                <p>.twin</p>
            </div>
        </div>
        <div class="footer">
            <p>.footer</p>
        </div>
    </div>
</body>

</html>
