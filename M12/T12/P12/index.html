<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata</title>
</head>
<body>
    <div>
        <h1>Form Biodata</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan Nama anda"   required/>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Masukkan username anda"   required/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Buat password"   required/>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="password" placeholder="Masukkan Email"   required/>
            </div>
            <div class="form-group">
                <label>Nomor HP</label>
                <input type="tel" placeholder="Masukkan No hp anda"   required/>
            </div>
            <div class="form-group">
                <label>Tanggal Lahir</label>
                <input type="date" required/>
            </div>
            <div class="form-group">
                <label>Jenis Kelamin</label>
                <input type="radio" id="laki" required/>
                <label class="labelforjk" for="laki">Laki-laki</label>
                <input type="radio" id="perempuan" required/>
                <label class="labelforjk" for="perempuan">Perempuan</label>
            </div>
            <div class="form-group">
                <label>Umur</label>
                <input type="number" required/>
            </div>
            <div class="form-group">
                <label>Warna Kesukaan</label>
                <input type="color" required/>
            </div>
            <hr>
            <div class="form-group">
                <label>Hobby</label>
                <input type="checkbox" id="scroll" required/>
                <label class="labelforhobby" for="scroll">Scrolling Reddit</label>
                <input type="checkbox" id="nonton" required/>
                <label class="labelforhobby" for="nonton">Menonton</label>
                <input type="checkbox" id="game" required/>
                <label class="labelforhobby" for="game">Gaming</label>
            </div>
            <div class="form-group">
                <label>Tingkat Kepedasan Makanan</label>
                <input type="range" required/>
            </div>
            <div class="form-group">
                <label>Saran dan Masukan</label>
                <textarea placeholder="Ketik Saran anda"></textarea>
            </div>
            <input type="submit"/>
            <input type="reset"/>
        </form>
    </div>
</body>
</html>
